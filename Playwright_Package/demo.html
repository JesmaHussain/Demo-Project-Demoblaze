
<!DOCTYPE html>
<html>
<head>
    <title>Playwright Locator Practice</title>
</head>
<body>

    <h1>Login Form</h1>

    <!-- Label + Input -->
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter Username">

    <br><br>

    <!-- Label + Input -->
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter Password">

    <br><br>

    <!-- Checkbox -->
    <label>
        <input type="checkbox">
        Remember Me
    </label>

    <br><br>

    <!-- Radio Buttons -->
    <label>
        <input type="radio" name="gender">
        Male
    </label>

    <label>
        <input type="radio" name="gender">
        Female
    </label>

    <br><br>

    <!-- Button -->
    <button>Login</button>

    <br><br>

    <!-- Link -->
    <a href="#">Forgot Password</a>

    <br><br>

    <!-- Text -->
    <p>Welcome to Playwright Practice Page</p>

</body>
</html>
